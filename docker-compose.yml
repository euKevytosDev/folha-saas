services:
  postgres:
    image: postgres:16-alpine
    container_name: folha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: folha
      POSTGRES_USER: folha
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-folha}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - folha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folha -d folha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  folha_pgdata:
