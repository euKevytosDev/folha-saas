<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel — Folha</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/placeholder.css">
    <link rel="stylesheet" href="/css/pages/store.css">
    <link rel="stylesheet" href="/css/pages/checkout.css">
    <script src="/js/env.js"></script>
</head>
<body class="page-shell">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/admin">
                <img class="brand-mark" src="/assets/icons/logo.svg" alt="">
                <span class="brand-name" id="store-name">Folha</span>
            </a>
            <div class="header-actions">
                <span class="muted" id="user-name"></span>
                <button class="btn btn-secondary" id="logout-button" type="button">Sair</button>
            </div>
        </div>
    </header>
    <main class="panel-main">
        <div class="container">
            <span class="badge" id="user-role">Painel</span>
            <h1>Sua loja</h1>
            <p class="muted">Pedidos, catálogo e equipe do estabelecimento.</p>
            <section class="card placeholder-card" style="margin-bottom:1.25rem;">
                <h2>Pedidos</h2>
                <div class="stat-grid" id="order-summary"></div>
                <div class="chip-row" id="order-filters" style="padding-bottom:0.75rem;"></div>
                <div id="orders-list"></div>
                <div class="alert" id="orders-alert" hidden></div>
            </section>
            <div class="panel-grid">
                <section class="card placeholder-card">
                    <h2>Estabelecimento</h2>
                    <p class="muted" id="store-slug"></p>
                    <p>Plano: <strong id="store-plan"></strong></p>
                    <p>Status: <strong id="store-status"></strong></p>
                    <p style="margin-top: 1rem;"><a class="btn btn-secondary" id="store-link" href="/">Ver loja pública</a></p>
                </section>
                <section class="card placeholder-card" id="users-card">
                    <h2>Equipe</h2>
                    <div id="users-list"></div>
                    <div class="alert" id="users-alert" hidden></div>
                    <form id="user-form" class="auth-form" style="margin-top: 1rem;">
                        <div class="field">
                            <label for="member-name">Nome</label>
                            <input id="member-name" name="name" type="text" required>
                        </div>
                        <div class="field">
                            <label for="member-email">E-mail</label>
                            <input id="member-email" name="email" type="email" required>
                        </div>
                        <div class="field">
                            <label for="member-password">Senha</label>
                            <input id="member-password" name="password" type="password" minlength="8" required>
                        </div>
                        <div class="field">
                            <label for="member-role">Perfil</label>
                            <select id="member-role" name="role">
                                <option value="STAFF">STAFF</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" type="submit">Adicionar</button>
                    </form>
                </section>
            </div>
            <div class="panel-grid" style="margin-top: 1.25rem;">
                <section class="card placeholder-card">
                    <h2>Categorias</h2>
                    <div id="categories-list"></div>
                    <div class="alert" id="category-alert" hidden></div>
                    <form id="category-form" class="auth-form" style="margin-top: 1rem;">
                        <div class="field">
                            <label for="category-name">Nome</label>
                            <input id="category-name" name="name" type="text" required>
                        </div>
                        <div class="field">
                            <label for="category-order">Ordem</label>
                            <input id="category-order" name="sortOrder" type="number" value="0">
                        </div>
                        <button class="btn btn-primary" type="submit">Salvar categoria</button>
                    </form>
                </section>
                <section class="card placeholder-card">
                    <h2>Produtos</h2>
                    <div id="products-list"></div>
                    <div class="alert" id="product-alert" hidden></div>
                    <form id="product-form" class="auth-form" style="margin-top: 1rem;">
                        <div class="field">
                            <label for="product-name">Nome</label>
                            <input id="product-name" name="name" type="text" required>
                        </div>
                        <div class="field">
                            <label for="product-category">Categoria</label>
                            <select id="product-category" name="categoryId" required></select>
                        </div>
                        <div class="field">
                            <label for="product-price">Preço</label>
                            <input id="product-price" name="price" type="number" min="0.01" step="0.01" required>
                        </div>
                        <div class="field">
                            <label for="product-unit">Unidade</label>
                            <select id="product-unit" name="unit">
                                <option value="UN">UN</option>
                                <option value="KG">KG</option>
                                <option value="G">G</option>
                                <option value="L">L</option>
                                <option value="ML">ML</option>
                                <option value="CX">CX</option>
                                <option value="PCT">PCT</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="product-image">Imagem (URL)</label>
                            <input id="product-image" name="imageUrl" type="url">
                        </div>
                        <label class="muted" style="display:flex;gap:0.5rem;align-items:center;">
                            <input id="product-featured" name="featured" type="checkbox">
                            Destacar na vitrine
                        </label>
                        <button class="btn btn-primary" type="submit">Salvar produto</button>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <script type="module" src="/js/pages/admin.js?v=5"></script>
</body>
</html>
