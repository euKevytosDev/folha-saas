<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel — Folha</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/placeholder.css">
</head>
<body class="page-shell">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/admin">
                <img class="brand-mark" src="/assets/icons/logo.svg" alt="">
                <span class="brand-name" id="store-name">Folha</span>
            </a>
            <div class="header-actions">
                <span class="muted" id="user-name"></span>
                <button class="btn btn-secondary" id="logout-button" type="button">Sair</button>
            </div>
        </div>
    </header>
    <main class="panel-main">
        <div class="container">
            <span class="badge" id="user-role">Painel</span>
            <h1>Sua loja</h1>
            <p class="muted">Pedidos e catálogo entram nas próximas fases. A autenticação e o isolamento do estabelecimento já estão ativos.</p>
            <div class="panel-grid">
                <section class="card placeholder-card">
                    <h2>Estabelecimento</h2>
                    <p class="muted" id="store-slug"></p>
                    <p>Plano: <strong id="store-plan"></strong></p>
                    <p>Status: <strong id="store-status"></strong></p>
                    <p style="margin-top: 1rem;"><a class="btn btn-secondary" id="store-link" href="/">Ver loja pública</a></p>
                </section>
                <section class="card placeholder-card" id="users-card">
                    <h2>Equipe</h2>
                    <div id="users-list"></div>
                    <div class="alert" id="users-alert" hidden></div>
                    <form id="user-form" class="auth-form" style="margin-top: 1rem;">
                        <div class="field">
                            <label for="member-name">Nome</label>
                            <input id="member-name" name="name" type="text" required>
                        </div>
                        <div class="field">
                            <label for="member-email">E-mail</label>
                            <input id="member-email" name="email" type="email" required>
                        </div>
                        <div class="field">
                            <label for="member-password">Senha</label>
                            <input id="member-password" name="password" type="password" minlength="8" required>
                        </div>
                        <div class="field">
                            <label for="member-role">Perfil</label>
                            <select id="member-role" name="role">
                                <option value="STAFF">STAFF</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" type="submit">Adicionar</button>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <script type="module" src="/js/pages/admin.js?v=2"></script>
</body>
</html>
