<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido — Folha</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/store.css?v=3">
    <link rel="stylesheet" href="/css/pages/checkout.css?v=2">
    <script src="/js/env.js"></script>
</head>
<body class="page-shell">
    <header class="store-header">
        <div class="container store-header-inner">
            <a class="btn btn-ghost" id="back-store" href="/">Voltar à loja</a>
            <div class="store-title">
                <strong>Acompanhar pedido</strong>
                <p class="muted" id="order-code"></p>
            </div>
        </div>
    </header>
    <main class="panel-main" style="padding-top: 1rem;">
        <div class="container checkout-layout">
            <div id="order-alert" class="alert" hidden></div>
            <section class="checkout-section" id="order-card" hidden>
                <span class="badge" id="order-status"></span>
                <h1 class="order-title" id="order-heading">Pedido recebido</h1>
                <p class="muted" id="order-meta"></p>
                <div id="order-items" style="margin-top:1rem;"></div>
                <div class="cart-totals" style="margin-top:1rem;">
                    <div><span>Subtotal</span><strong id="order-subtotal">R$ 0,00</strong></div>
                    <div><span>Total</span><strong id="order-total">R$ 0,00</strong></div>
                </div>
                <div class="payment-box" id="payment-box" hidden></div>
                <div class="order-details" id="order-details"></div>
            </section>
        </div>
    </main>
    <script type="module" src="/js/pages/pedido.js?v=3"></script>
</body>
</html>
