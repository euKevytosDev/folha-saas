<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loja — Folha</title>
    <meta name="description" content="Loja online do estabelecimento.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/placeholder.css">
</head>
<body class="page-shell">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <img class="brand-mark" src="/assets/icons/logo.svg" alt="">
                <span class="brand-name" id="store-name">Loja</span>
            </a>
        </div>
    </header>
    <main class="panel-main">
        <div class="container">
            <span class="badge">Em construção</span>
            <h1>A vitrine pública entra na Fase 3.</h1>
            <p class="muted">O endereço da loja já está no ar. Catálogo, busca e carrinho vêm em seguida.</p>
            <div class="card placeholder-card">
                <p>Enquanto isso, você pode acompanhar o painel administrativo e o cadastro da loja.</p>
                <p style="margin-top: 1rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
                    <a class="btn btn-primary" href="/cadastro">Criar loja</a>
                    <a class="btn btn-secondary" href="/">Voltar</a>
                </p>
            </div>
        </div>
    </main>
    <script type="module" src="/js/pages/store.js"></script>
</body>
</html>
