<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar loja — Folha</title>
    <meta name="description" content="Cadastre o seu sacolão e publique a loja online.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body class="page-shell">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <img class="brand-mark" src="/assets/icons/logo.svg" alt="">
                <span class="brand-name">Folha</span>
            </a>
        </div>
    </header>
    <main class="auth-main">
        <section class="card auth-card">
            <h1>Criar sua loja</h1>
            <p class="muted">Leva poucos minutos. Você pode completar o catálogo depois.</p>
            <div class="alert" hidden></div>
            <form id="signup-form" class="auth-form">
                <div class="field">
                    <label for="store">Nome do estabelecimento</label>
                    <input id="store" name="store" type="text" required>
                </div>
                <div class="field">
                    <label for="name">Seu nome</label>
                    <input id="name" name="name" type="text" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
            </form>
            <div class="auth-links">
                <a href="/login">Já tenho conta</a>
            </div>
        </section>
    </main>
    <script type="module" src="/js/pages/auth.js?v=2"></script>
</body>
</html>
