name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build-pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend estático
        env:
          FOLHA_API_URL: ${{ vars.FOLHA_API_URL }}
          FOLHA_BASE_PATH: ${{ vars.FOLHA_BASE_PATH }}
        run: bash scripts/build-pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
