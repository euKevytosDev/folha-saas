spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5433/folha_test}
    username: ${DATABASE_USERNAME:folha}
    password: ${DATABASE_PASSWORD:folha}
  jpa:
    hibernate:
      ddl-auto: none

app:
  frontend-dir: ${user.dir}/../frontend
  cors:
    allowed-origins:
      - http://localhost:8080
  jwt:
    secret: test-secret-only-for-local-tests-not-prod
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  auth:
    password-reset-expiration-ms: 3600000
    cookie-secure: false
  bootstrap:
    superadmin-email:
    superadmin-password:
  payments:
    simulate-enabled: true
    mock-webhooks-enabled: true
    require-webhook-secret: false
    mock-webhook-secret: folha-test-webhook-secret
  security:
    rate-limit:
      login-max-attempts: 100
      login-window-seconds: 60
      register-max-attempts: 100
      register-window-seconds: 60
  cloudinary:
    cloud-name:
    api-key:
    api-secret:
    url:
    folder: folha-test
    max-bytes: 5242880
