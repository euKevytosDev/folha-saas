<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout — Folha</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/store.css">
    <link rel="stylesheet" href="/css/pages/checkout.css">
    <script src="/js/env.js"></script>
</head>
<body class="page-shell">
    <header class="store-header">
        <div class="container store-header-inner">
            <a class="btn btn-ghost" id="back-store" href="/">Voltar</a>
            <div class="store-title">
                <strong id="store-name">Checkout</strong>
                <p class="muted">Finalize seu pedido</p>
            </div>
        </div>
    </header>
    <main class="panel-main" style="padding-top: 1rem;">
        <div class="container checkout-layout">
            <div id="checkout-alert" class="alert" hidden></div>
            <form id="checkout-form" class="checkout-form" novalidate>
                <section class="checkout-section">
                    <h2>Seus dados</h2>
                    <div class="field">
                        <label for="customer-name">Nome</label>
                        <input id="customer-name" name="customerName" type="text" required maxlength="160" autocomplete="name">
                    </div>
                    <div class="field">
                        <label for="customer-phone">Telefone / WhatsApp</label>
                        <input id="customer-phone" name="customerPhone" type="tel" required maxlength="32" autocomplete="tel" inputmode="tel">
                    </div>
                    <div class="field">
                        <label for="customer-email">E-mail (opcional)</label>
                        <input id="customer-email" name="customerEmail" type="email" maxlength="255" autocomplete="email">
                    </div>
                </section>
                <section class="checkout-section">
                    <h2>Como receber</h2>
                    <div class="choice-row">
                        <label class="choice">
                            <input type="radio" name="fulfillmentType" value="DELIVERY" checked>
                            <span>Entrega</span>
                        </label>
                        <label class="choice">
                            <input type="radio" name="fulfillmentType" value="PICKUP">
                            <span>Retirada</span>
                        </label>
                    </div>
                    <div id="address-fields" class="address-grid">
                        <div class="field">
                            <label for="zip">CEP</label>
                            <input id="zip" name="addressZipCode" type="text" maxlength="16" autocomplete="postal-code">
                        </div>
                        <div class="field field-span">
                            <label for="street">Rua</label>
                            <input id="street" name="addressStreet" type="text" maxlength="255" autocomplete="street-address">
                        </div>
                        <div class="field">
                            <label for="number">Número</label>
                            <input id="number" name="addressNumber" type="text" maxlength="32">
                        </div>
                        <div class="field">
                            <label for="complement">Complemento</label>
                            <input id="complement" name="addressComplement" type="text" maxlength="120">
                        </div>
                        <div class="field">
                            <label for="neighborhood">Bairro</label>
                            <input id="neighborhood" name="addressNeighborhood" type="text" maxlength="120">
                        </div>
                        <div class="field">
                            <label for="city">Cidade</label>
                            <input id="city" name="addressCity" type="text" maxlength="120">
                        </div>
                        <div class="field">
                            <label for="state">UF</label>
                            <input id="state" name="addressState" type="text" maxlength="2" style="text-transform:uppercase">
                        </div>
                    </div>
                </section>
                <section class="checkout-section">
                    <h2>Pagamento</h2>
                    <div class="choice-row choice-wrap">
                        <label class="choice"><input type="radio" name="paymentMethod" value="PIX" checked><span>PIX</span></label>
                        <label class="choice"><input type="radio" name="paymentMethod" value="CASH"><span>Dinheiro</span></label>
                        <label class="choice"><input type="radio" name="paymentMethod" value="CARD"><span>Cartão</span></label>
                        <label class="choice"><input type="radio" name="paymentMethod" value="ON_DELIVERY"><span>Na entrega</span></label>
                    </div>
                    <p class="muted">O pagamento ainda não é processado online — a loja confirma o pedido e combina a cobrança.</p>
                </section>
                <section class="checkout-section">
                    <h2>Observações</h2>
                    <div class="field">
                        <label class="visually-hidden" for="notes">Observações</label>
                        <textarea id="notes" name="notes" rows="3" maxlength="2000" placeholder="Ex.: tocar o interfone, troco para R$ 50..."></textarea>
                    </div>
                </section>
                <section class="checkout-section checkout-summary">
                    <h2>Resumo</h2>
                    <div id="summary-lines"></div>
                    <div class="cart-totals">
                        <div><span>Subtotal</span><strong id="summary-subtotal">R$ 0,00</strong></div>
                        <div><span>Desconto</span><span id="summary-discount">R$ 0,00</span></div>
                        <div><span>Entrega</span><span id="summary-delivery">R$ 0,00</span></div>
                        <div class="is-total"><span>Total</span><span id="summary-total">R$ 0,00</span></div>
                    </div>
                    <button class="btn btn-primary btn-block" id="submit-order" type="submit">Finalizar pedido</button>
                </section>
            </form>
        </div>
    </main>
    <script type="module" src="/js/pages/checkout.js?v=1"></script>
</body>
</html>
