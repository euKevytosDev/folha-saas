server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: folha
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/folha}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:folha}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:folha}}
    hikari:
      pool-name: folha-pool
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  name: Folha
  frontend-dir: ${FRONTEND_DIR:}
  public-frontend-url: ${PUBLIC_FRONTEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://eukevytosdev.github.io}
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-not-for-production-use-32b}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  auth:
    password-reset-expiration-ms: ${PASSWORD_RESET_EXPIRATION_MS:3600000}
    cookie-secure: ${COOKIE_SECURE:false}
  bootstrap:
    superadmin-email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
    superadmin-password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
  payments:
    simulate-enabled: ${PAYMENTS_SIMULATE_ENABLED:true}
    mock-webhooks-enabled: ${PAYMENTS_MOCK_WEBHOOKS_ENABLED:true}
    require-webhook-secret: ${PAYMENTS_REQUIRE_WEBHOOK_SECRET:false}
    mock-webhook-secret: ${PAYMENTS_MOCK_WEBHOOK_SECRET:folha-dev-webhook-secret}
  security:
    rate-limit:
      login-max-attempts: ${RATE_LIMIT_LOGIN_MAX:20}
      login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:300}
      register-max-attempts: ${RATE_LIMIT_REGISTER_MAX:10}
      register-window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:300}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    url: ${CLOUDINARY_URL:}
    folder: ${CLOUDINARY_FOLDER:folha}
    max-bytes: ${CLOUDINARY_MAX_BYTES:5242880}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:Folha <onboarding@resend.dev>}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{tenantId:-}] %logger{36} - %msg%n"
